    - cron: '0 12 */2 * *'   # cada 2 días, 12:00 UTC
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta simple a Supabase
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_uZITUaJiJUAZKQVBzGnusw_VMFp72b2" \
            "https://vmseqwogmuiyqtjgzctt.supabase.co/rest/v1/farmacias?select=id&limit=1"
