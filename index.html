<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Días de Producto · Más por Menos</title>
<style>
:root{--r:#c8102e;--rd:#9d0c24;--bg:#fff;--ink:#222;--ln:#e8dede;--ok:#e9f6ea;--okt:#2e7d32;--warn:#fff1f1;--full:#fbd9dd}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--r);color:#fff;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
select,button,input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--ln)}
button{cursor:pointer;background:#fff;color:var(--r);border-color:var(--r);font-weight:600}
button.p{background:var(--r);color:#fff}
header button{border-color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--rd);outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.bar b{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-weight:700;color:var(--rd);font-size:12px}
.day{border:1px solid var(--ln);border-radius:8px;min-height:64px;padding:4px;cursor:pointer;font-size:12px;background:#fff}
.day b{font-size:14px}
.day small{display:block;margin-top:4px}
.day.free{background:var(--ok)}.day.some{background:var(--warn)}.day.full{background:var(--full)}
.day.off{opacity:.45;cursor:default}.day.nil{border:0;background:none;cursor:default}
.blk{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--ln);border-left:5px solid var(--okt);border-radius:8px;padding:10px;margin:6px 0}
.blk.t{border-left-color:var(--r)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
dialog{border:0;border-radius:12px;padding:16px;width:360px;max-width:92vw}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog input{width:100%;margin:6px 0}
</style>
</head>
<body>
<header>
  <h1>Días de producto · Más por Menos</h1>
  <div class="row">
    <select id="fs" aria-label="Farmacia"></select>
    <button id="adm">Admin</button>
  </div>
</header>
<main>
  <div class="bar">
    <button id="prev" aria-label="Mes anterior">←</button>
    <b id="mes"></b>
    <button id="next" aria-label="Mes siguiente">→</button>
  </div>
  <div id="month" class="grid"></div>
  <div id="day" hidden></div>
  <div class="row" style="margin-top:16px">
    <button class="p" id="pdf1">Descargar PDF de esta farmacia</button>
    <button id="pdfA">Descargar PDF de todas</button>
  </div>
</main>

<dialog id="dlg">
  <form id="fm">
    <h3 style="margin:0">Apartar bloque</h3>
    <input id="lab" placeholder="Laboratorio" required minlength="2" maxlength="80">
    <input id="prod" placeholder="Producto" maxlength="120">
    <div class="row"><button class="p">Apartar</button><button type="button" id="cx">Cancelar</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const SB_URL = 'https://vmseqwogmuiyqtjgzctt.supabase.co';
const SB_KEY = 'sb_publishable_uZITUaJiJUAZKQVBzGnusw_VMFp72b2';
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = s => document.querySelector(s);
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
const hh = t => t.slice(0, 5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => { const t = new Date(); return iso(t.getFullYear(), t.getMonth(), t.getDate()); };

let F = [], B = [], R = [], fid = null, day = null, pin = null, bid = null;
let y = new Date().getFullYear(), m = new Date().getMonth();

const bl = f => B.filter(b => b.farmacia_id == f);
const rs = (b, d) => R.find(r => r.bloque_id == b && r.fecha == d);

async function load() {
  const ini = iso(y, m, 1), fin = m === 11 ? iso(y + 1, 0, 1) : iso(y, m + 1, 1);
  const [a, b, c] = await Promise.all([
    sb.from('farmacias').select('*').order('id'),
    sb.from('bloques').select('*').order('hora_inicio'),
    sb.from('reservas').select('*').gte('fecha', ini).lt('fecha', fin)
  ]);
  if (a.error || b.error || c.error) { alert('No se pudo conectar con la base de datos. Revisa SB_URL y SB_KEY.'); return; }
  F = a.data; B = b.data; R = c.data;
  if (!fid) fid = F[0]?.id;
  render();
}

function render() {
  $('#fs').innerHTML = F.map(f => `<option value="${f.id}" ${f.id == fid ? 'selected' : ''}>${esc(f.nombre)}</option>`).join('');
  $('#mes').textContent = MESES[m] + ' ' + y;
  $('#adm').textContent = pin ? 'Salir de admin' : 'Admin';
  day ? renderDay() : renderMonth();
}

function renderMonth() {
  $('#day').hidden = true; $('#month').hidden = false;
  const bs = bl(fid), first = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate(), h = hoy();
  let html = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => `<div class="dow">${d}</div>`).join('');
  html += '<div class="day nil"></div>'.repeat(first);
  for (let d = 1; d <= n; d++) {
    const date = iso(y, m, d), used = bs.filter(b => rs(b.id, date)).length, tot = bs.length;
    const cls = !tot ? '' : used === 0 ? 'free' : used === tot ? 'full' : 'some';
    html += `<div class="day ${cls} ${date < h && !pin ? 'off' : ''}" data-d="${date}"><b>${d}</b><small>${tot ? (tot - used) + ' libres' : 'Sin bloques'}</small></div>`;
  }
  $('#month').innerHTML = html;
}

function renderDay() {
  $('#month').hidden = true;
  const el = $('#day'), bs = bl(fid), past = day < hoy();
  el.hidden = false;
  el.innerHTML =
    `<div class="bar"><button id="back">← Volver al mes</button><b>${day.split('-').reverse().join('/')}</b></div>` +
    (bs.length ? bs.map(b => {
      const r = rs(b.id, day);
      return `<div class="blk ${r ? 't' : ''}">
        <div><b>${hh(b.hora_inicio)} – ${hh(b.hora_fin)}</b><br>${r ? esc(r.laboratorio) + (r.producto ? ' · ' + esc(r.producto) : '') : 'Libre'}</div>
        <div class="row">
          ${r ? (pin ? `<button data-x="r${r.id}">Liberar</button>` : '') : (past ? '' : `<button class="p" data-x="a${b.id}">Apartar</button>`)}
          ${pin ? `<button data-x="b${b.id}">Quitar bloque</button>` : ''}
        </div></div>`;
    }).join('') : '<p>Esta farmacia no tiene bloques.</p>') +
    (pin ? `<div class="row" style="margin-top:12px"><input type="time" id="ti" aria-label="Inicio"><input type="time" id="te" aria-label="Fin"><button class="p" id="addb">Agregar bloque</button></div>` : '');
}

async function admin(fn, args) {
  const { error } = await sb.rpc(fn, { p: pin, ...args });
  if (error) { alert(error.message); if (/PIN/.test(error.message)) pin = null; }
  load();
}

$('#month').onclick = e => {
  const c = e.target.closest('.day');
  if (!c || !c.dataset.d || (c.classList.contains('off') && !pin)) return;
  day = c.dataset.d; render();
};

$('#day').onclick = e => {
  if (e.target.id === 'back') { day = null; render(); return; }
  if (e.target.id === 'addb') {
    const i = $('#ti').value, f = $('#te').value;
    if (!i || !f || f <= i) { alert('Indica una hora de inicio y una de fin válidas.'); return; }
    admin('admin_add_bloque', { f: fid, i, e: f }); return;
  }
  const x = e.target.dataset.x; if (!x) return;
  const k = x[0], id = +x.slice(1);
  if (k === 'a') {
    bid = id;
    try { $('#lab').value = localStorage.getItem('lab') || ''; } catch { }
    $('#prod').value = ''; $('#dlg').showModal();
  }
  if (k === 'r' && confirm('¿Liberar este bloque?')) admin('admin_del_reserva', { i: id });
  if (k === 'b' && confirm('¿Quitar este bloque y sus reservas?')) admin('admin_del_bloque', { i: id });
};

$('#fm').onsubmit = async e => {
  e.preventDefault();
  const lab = $('#lab').value.trim();
  const { error } = await sb.from('reservas').insert({ bloque_id: bid, fecha: day, laboratorio: lab, producto: $('#prod').value.trim() || null });
  if (error) alert(error.code === '23505' ? 'Ese bloque ya fue apartado por otro laboratorio.' : 'Error: ' + error.message);
  else { try { localStorage.setItem('lab', lab); } catch { } }
  $('#dlg').close(); load();
};
$('#cx').onclick = () => $('#dlg').close();

$('#fs').onchange = e => { fid = +e.target.value; day = null; render(); };
$('#prev').onclick = () => { m--; if (m < 0) { m = 11; y--; } day = null; load(); };
$('#next').onclick = () => { m++; if (m > 11) { m = 0; y++; } day = null; load(); };

$('#adm').onclick = async () => {
  if (pin) { pin = null; render(); return; }
  const p = prompt('PIN de administrador');
  if (!p) return;
  const { data } = await sb.rpc('admin_ok', { p });
  if (data === true) { pin = p; render(); } else alert('PIN incorrecto.');
};

function pdf(all) {
  const doc = new jspdf.jsPDF();
  const list = all ? F : F.filter(f => f.id == fid), n = new Date(y, m + 1, 0).getDate();
  list.forEach((f, k) => {
    if (k) doc.addPage();
    const bs = bl(f.id), body = [];
    doc.setFontSize(15); doc.setTextColor(200, 16, 46);
    doc.text(`${f.nombre} · Días de producto · ${MESES[m]} ${y}`, 14, 14);
    for (let d = 1; d <= n; d++) {
      const date = iso(y, m, d);
      body.push([`${DIAS[new Date(y, m, d).getDay()]} ${d}`, ...bs.map(b => {
        const r = rs(b.id, date);
        return r ? r.laboratorio + (r.producto ? ' - ' + r.producto : '') : 'Disponible';
      })]);
    }
    doc.autoTable({
      startY: 20, theme: 'grid', styles: { fontSize: 8, cellPadding: 1.5 },
      head: [['Día', ...bs.map(b => hh(b.hora_inicio) + '-' + hh(b.hora_fin))]], body,
      headStyles: { fillColor: [200, 16, 46] },
      didParseCell: h => { if (h.section === 'body' && h.column.index > 0 && h.cell.raw === 'Disponible') h.cell.styles.textColor = [150, 150, 150]; }
    });
  });
  doc.save(`Calendario_${MESES[m]}_${y}${all ? '_todas' : ''}.pdf`);
}
$('#pdf1').onclick = () => pdf(false);
$('#pdfA').onclick = () => pdf(true);

load();
sb.channel('reservas-live').on('postgres_changes', { event: '*', schema: 'public', table: 'reservas' }, load).subscribe();
</script>
</body>
</html>
